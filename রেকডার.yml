          cat > earflow_project/app/src/main/java/com/earflow/app/CallReceiver.kt <<'EFEOF'
          package com.earflow.app

          import android.content.*
          import android.telephony.TelephonyManager
          import androidx.core.content.ContextCompat

          class CallReceiver : BroadcastReceiver() {
              companion object {
                  private var lastState = TelephonyManager.CALL_STATE_IDLE
                  private var incoming = false
                  private var number = ""
                  private var recording = false
              }

              private fun send(ctx: Context, act: String) {
                  try {
                      ContextCompat.startForegroundService(ctx, Intent(ctx, CallRecordService::class.java).apply {
                          action = act
                          putExtra("number", number)
                          putExtra("incoming", incoming)
                      })
                  } catch (_: Exception) {}
              }

              override fun onReceive(ctx: Context, intent: Intent) {
                  if (!ctx.getSharedPreferences("ef", Context.MODE_PRIVATE).getBoolean("auto", false)) return
                  if (intent.action == Intent.ACTION_NEW_OUTGOING_CALL) {
                      number = intent.getStringExtra(Intent.EXTRA_PHONE_NUMBER) ?: ""
                      incoming = false
                      return
                  }
                  val st = when (intent.getStringExtra(TelephonyManager.EXTRA_STATE)) {
                      TelephonyManager.EXTRA_STATE_RINGING -> TelephonyManager.CALL_STATE_RINGING
                      TelephonyManager.EXTRA_STATE_OFFHOOK -> TelephonyManager.CALL_STATE_OFFHOOK
                      else -> TelephonyManager.CALL_STATE_IDLE
                  }
                  @Suppress("DEPRECATION")
                  val num = intent.getStringExtra(TelephonyManager.EXTRA_INCOMING_NUMBER)
                  if (st == TelephonyManager.CALL_STATE_RINGING) {
                      incoming = true
                      if (!num.isNullOrEmpty()) number = num
                  }
                  if (st == lastState) return

                  when (st) {
                      TelephonyManager.CALL_STATE_OFFHOOK -> {
                          if (lastState != TelephonyManager.CALL_STATE_RINGING) incoming = false
                          if (!recording) { recording = true; send(ctx, "START") }
                      }
                      TelephonyManager.CALL_STATE_IDLE -> {
                          if (recording) { recording = false; send(ctx, "STOP") }
                          number = ""
                      }
                  }
                  lastState = st
              }
          }
          EFEOF
          cat > earflow_project/app/src/main/java/com/earflow/app/CallRecordService.kt <<'EFEOF'
          package com.earflow.app

          import android.app.*
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.content.Intent
          import android.media.*
          import android.media.audiofx.AutomaticGainControl
          import android.net.Uri
          import android.os.*
          import android.provider.CallLog
          import android.provider.ContactsContract
          import androidx.core.app.NotificationCompat
          import java.io.File
          import java.io.RandomAccessFile
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.text.SimpleDateFormat
          import java.util.*
          import kotlin.math.abs

          class CallRecordService : Service() {
              @Volatile private var running = false
              private val main = Handler(Looper.getMainLooper())

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  startFg()
                  when (intent?.action) {
                      "START" -> startRec(intent.getStringExtra("number") ?: "", intent.getBooleanExtra("incoming", true))
                      "STOP" -> running = false
                      "QUIT" -> { running = false; stopForeground(STOP_FOREGROUND_REMOVE); stopSelf() }
                  }
                  return START_STICKY
              }

              private fun startFg() {
                  getSystemService(NotificationManager::class.java)
                      .createNotificationChannel(NotificationChannel("call", "Call recorder", NotificationManager.IMPORTANCE_LOW))
                  val n = NotificationCompat.Builder(this, "call")
                      .setContentTitle("ইয়ার-ফ্লো: অটো কল রেকর্ড চালু")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now).setOngoing(true).build()
                  if (checkSelfPermission(android.Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED)
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  else startForeground(1, n)
              }

              private fun clean(s: String) = s.replace(Regex("[^\\p{L}\\p{N}+ ]"), "_")

              private fun fileName(name: String, num: String, incoming: Boolean, time: String) =
                  "${clean(name)}_${clean(num.ifEmpty { "NoNumber" })}_${if (incoming) "IN" else "OUT"}_$time.wav"

              private fun startRec(numberIn: String, incoming: Boolean) {
                  if (running) return
                  running = true
                  val p = getSharedPreferences("ef", MODE_PRIVATE)
                  val maxGain = p.getInt("gain", 12).toFloat()
                  val audio = getSystemService(AudioManager::class.java)
                  val oldSpeaker = audio.isSpeakerphoneOn
                  val oldVol = audio.getStreamVolume(AudioManager.STREAM_VOICE_CALL)

                  // অপর প্রান্তের আওয়াজ মাইকে ধরতে: স্পিকার অন + ভলিউম ম্যাক্স
                  if (p.getBoolean("speaker", true)) {
                      @Suppress("DEPRECATION")
                      audio.isSpeakerphoneOn = true
                      audio.setStreamVolume(AudioManager.STREAM_VOICE_CALL,
                          audio.getStreamMaxVolume(AudioManager.STREAM_VOICE_CALL), 0)
                  }

                  val time = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date())
                  val dir = File(getExternalFilesDir(null), "calls").apply { mkdirs() }
                  val name = contactName(numberIn) ?: "Unknown"
                  val file = File(dir, fileName(name, numberIn, incoming, time))

                  Thread {
                      val rate = 16000
                      val bufSize = maxOf(AudioRecord.getMinBufferSize(rate, AudioFormat.CHANNEL_IN_MONO,
                          AudioFormat.ENCODING_PCM_16BIT), rate * 2)
                      var rec: AudioRecord? = null
                      for (src in intArrayOf(MediaRecorder.AudioSource.VOICE_CALL, MediaRecorder.AudioSource.UNPROCESSED,
                          MediaRecorder.AudioSource.VOICE_RECOGNITION, MediaRecorder.AudioSource.MIC)) {
                          try {
                              val r = AudioRecord(src, rate, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, bufSize)
                              if (r.state == AudioRecord.STATE_INITIALIZED) { rec = r; break } else r.release()
                          } catch (_: Exception) {}
                      }
                      var total = 0L
                      try {
                          if (rec != null) {
                              if (AutomaticGainControl.isAvailable())
                                  AutomaticGainControl.create(rec.audioSessionId)?.enabled = true
                              val raf = RandomAccessFile(file, "rw")
                              raf.setLength(0); raf.write(ByteArray(44))
                              val buf = ShortArray(bufSize / 2)
                              var gain = 1f
                              rec.startRecording()
                              while (running) {
                                  val n = rec.read(buf, 0, buf.size)
                                  if (n <= 0) continue
                                  var peak = 1
                                  for (i in 0 until n) { val a = abs(buf[i].toInt()); if (a > peak) peak = a }
                                  // কম আওয়াজ হলে অটো গেইন বাড়ে, জোরে হলে সঙ্গে সঙ্গে কমে
                                  if (peak > 40) {
                                      val target = (26000f / peak).coerceIn(1f, maxGain)
                                      gain = if (target < gain) target else gain + (target - gain) * 0.15f
                                  }
                                  val out = ByteArray(n * 2)
                                  for (i in 0 until n) {
                                      val v = (buf[i] * gain).toInt().coerceIn(-32768, 32767)
                                      out[2 * i] = (v and 0xff).toByte()
                                      out[2 * i + 1] = ((v shr 8) and 0xff).toByte()
                                  }
                                  raf.write(out); total += out.size
                              }
                              try { rec.stop() } catch (_: Exception) {}
                              rec.release()
                              val b = ByteBuffer.allocate(44).order(ByteOrder.LITTLE_ENDIAN)
                              b.put("RIFF".toByteArray()); b.putInt((36 + total).toInt()); b.put("WAVE".toByteArray())
                              b.put("fmt ".toByteArray()); b.putInt(16); b.putShort(1); b.putShort(1)
                              b.putInt(rate); b.putInt(rate * 2); b.putShort(2); b.putShort(16)
                              b.put("data".toByteArray()); b.putInt(total.toInt())
                              raf.seek(0); raf.write(b.array()); raf.close()
                          }
                      } finally {
                          running = false
                          @Suppress("DEPRECATION")
                          audio.isSpeakerphoneOn = oldSpeaker
                          audio.setStreamVolume(AudioManager.STREAM_VOICE_CALL, oldVol, 0)
                          // নম্বর না পেলে কল লগ থেকে নিয়ে ফাইলের নাম ঠিক করা
                          main.postDelayed({ fixName(file, numberIn, incoming, time) }, 2500)
                      }
                  }.start()
              }

              private fun fixName(file: File, numberIn: String, incoming: Boolean, time: String) {
                  if (numberIn.isNotEmpty() || !file.exists()) return
                  try {
                      contentResolver.query(CallLog.Calls.CONTENT_URI,
                          arrayOf(CallLog.Calls.NUMBER, CallLog.Calls.CACHED_NAME), null, null, "date DESC")?.use {
                          if (it.moveToFirst()) {
                              val num = it.getString(0) ?: return
                              val name = it.getString(1) ?: contactName(num) ?: "Unknown"
                              file.renameTo(File(file.parentFile, fileName(name, num, incoming, time)))
                          }
                      }
                  } catch (_: Exception) {}
              }

              private fun contactName(number: String): String? {
                  if (number.isEmpty()) return null
                  return try {
                      val uri = Uri.withAppendedPath(ContactsContract.PhoneLookup.CONTENT_FILTER_URI, Uri.encode(number))
                      contentResolver.query(uri, arrayOf(ContactsContract.PhoneLookup.DISPLAY_NAME), null, null, null)
                          ?.use { if (it.moveToFirst()) it.getString(0) else null }
                  } catch (_: Exception) { null }
              }
          }
          EFEOF
          cat > earflow_project/app/src/main/java/com/earflow/app/EarFlowAccessibilityService.kt <<'EFEOF'
          package com.earflow.app

          import android.accessibilityservice.AccessibilityService
          import android.view.accessibility.AccessibilityEvent

          // কলের সময় কিছু ফোনে মাইক্রোফোন অ্যাক্সেস পেতে এই সার্ভিস চালু থাকা দরকার
          class EarFlowAccessibilityService : AccessibilityService() {
              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() {}
          }
          EFEOF
          cat > earflow_project/app/src/main/java/com/earflow/app/EditorActivity.kt <<'EFEOF'
          package com.earflow.app

          import android.content.ContentValues
          import android.media.*
          import android.os.*
          import android.provider.MediaStore
          import android.view.ViewGroup.LayoutParams.MATCH_PARENT
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import java.io.File
          import java.nio.ByteBuffer
          import kotlin.math.max

          class EditorActivity : AppCompatActivity() {
              private lateinit var path: String
              private lateinit var video: VideoView
              private var dur = 0
              private var startMs = 0
              private var endMs = 0
              private val h = Handler(Looper.getMainLooper())

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  title = "ভিডিও এডিটর"
                  path = intent.getStringExtra("path")!!
                  MediaMetadataRetriever().also {
                      it.setDataSource(path)
                      dur = it.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION)!!.toInt(); it.release()
                  }
                  endMs = dur

                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(24, 24, 24, 24) }
                  video = VideoView(this).apply { setVideoPath(path); seekTo(1) }
                  root.addView(video, LinearLayout.LayoutParams(MATCH_PARENT, 0, 1f))

                  val info = TextView(this)
                  fun upd() { info.text = "শুরু: ${startMs / 1000.0}s   শেষ: ${endMs / 1000.0}s   (মোট ${dur / 1000.0}s)" }
                  upd()
                  root.addView(info)

                  fun seek(label: String, init: Int, onCh: (Int) -> Unit): SeekBar {
                      root.addView(TextView(this).apply { text = label })
                      return SeekBar(this).apply {
                          max = dur; progress = init
                          setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                              override fun onProgressChanged(sb: SeekBar?, p: Int, user: Boolean) { if (user) { onCh(p); upd() } }
                              override fun onStartTrackingTouch(sb: SeekBar?) {}
                              override fun onStopTrackingTouch(sb: SeekBar?) {}
                          })
                          root.addView(this)
                      }
                  }
                  seek("শুরু", 0) { startMs = minOf(it, endMs - 100); video.seekTo(startMs) }
                  seek("শেষ", dur) { endMs = max(it, startMs + 100) }

                  fun btn(t: String, f: () -> Unit) = Button(this).apply { text = t; setOnClickListener { f() }; root.addView(this) }
                  btn("▶ নির্বাচিত অংশ প্লে") {
                      video.seekTo(startMs); video.start()
                      val chk = object : Runnable {
                          override fun run() {
                              if (video.currentPosition >= endMs) video.pause() else if (video.isPlaying) h.postDelayed(this, 50)
                          }
                      }
                      h.postDelayed(chk, 100)
                  }
                  btn("✂ ট্রিম করে নতুন ভিডিও সেভ") {
                      val dst = File(File(path).parentFile, "EarFlow_trim_${System.currentTimeMillis()}.mp4")
                      Toast.makeText(this, "সেভ হচ্ছে...", Toast.LENGTH_SHORT).show()
                      Thread {
                          try { trim(path, dst.absolutePath, startMs * 1000L, endMs * 1000L)
                              runOnUiThread { Toast.makeText(this, "সেভ হয়েছে: ${dst.name}", Toast.LENGTH_LONG).show() }
                          } catch (e: Exception) { runOnUiThread { Toast.makeText(this, "ব্যর্থ: ${e.message}", Toast.LENGTH_LONG).show() } }
                      }.start()
                  }
                  btn("📥 গ্যালারিতে সেভ") { toGallery() }
                  setContentView(root)
              }

              // রি-এনকোড ছাড়া ট্রিম (দ্রুত, কোয়ালিটি লস নেই); শুরু সবচেয়ে কাছের কী-ফ্রেমে যায়
              private fun trim(src: String, dst: String, startUs: Long, endUs: Long) {
                  val ex = MediaExtractor().apply { setDataSource(src) }
                  val mux = MediaMuxer(dst, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
                  val map = HashMap<Int, Int>()
                  var maxBuf = 1 shl 20
                  for (i in 0 until ex.trackCount) {
                      val f = ex.getTrackFormat(i)
                      val m = f.getString(MediaFormat.KEY_MIME) ?: continue
                      if (m.startsWith("video/") || m.startsWith("audio/")) {
                          ex.selectTrack(i); map[i] = mux.addTrack(f)
                          if (f.containsKey(MediaFormat.KEY_MAX_INPUT_SIZE)) maxBuf = max(maxBuf, f.getInteger(MediaFormat.KEY_MAX_INPUT_SIZE))
                      }
                  }
                  mux.start()
                  ex.seekTo(startUs, MediaExtractor.SEEK_TO_PREVIOUS_SYNC)
                  val buf = ByteBuffer.allocate(maxBuf)
                  val info = MediaCodec.BufferInfo()
                  var base = -1L
                  while (true) {
                      info.size = ex.readSampleData(buf, 0)
                      if (info.size < 0) break
                      val t = ex.sampleTime
                      if (t > endUs) break
                      if (base < 0) base = t
                      info.presentationTimeUs = max(0L, t - base)
                      info.flags = ex.sampleFlags
                      info.offset = 0
                      mux.writeSampleData(map[ex.sampleTrackIndex]!!, buf, info)
                      ex.advance()
                  }
                  mux.stop(); mux.release(); ex.release()
              }

              private fun toGallery() {
                  val f = File(path)
                  val v = ContentValues().apply {
                      put(MediaStore.Video.Media.DISPLAY_NAME, f.name)
                      put(MediaStore.Video.Media.MIME_TYPE, "video/mp4")
                      put(MediaStore.Video.Media.RELATIVE_PATH, "Movies/EarFlow")
                  }
                  val uri = contentResolver.insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, v)
                  if (uri != null) {
                      contentResolver.openOutputStream(uri)?.use { o -> f.inputStream().use { it.copyTo(o) } }
                      Toast.makeText(this, "গ্যালারি > Movies/EarFlow এ সেভ হয়েছে", Toast.LENGTH_LONG).show()
                  }
              }
          }
          EFEOF
          cat > earflow_project/app/src/main/java/com/earflow/app/MainActivity.kt <<'EFEOF'
          package com.earflow.app

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.media.MediaPlayer
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Bundle
          import android.os.PowerManager
          import android.provider.Settings
          import android.view.View
          import android.view.ViewGroup.LayoutParams.MATCH_PARENT
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import java.io.File

          class MainActivity : AppCompatActivity() {
              private lateinit var prefs: android.content.SharedPreferences
              private lateinit var list: ListView
              private var tab = 0
              private var files = listOf<File>()
              private var player: MediaPlayer? = null

              private val projLauncher = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { r ->
                  if (r.resultCode == RESULT_OK && r.data != null) {
                      ContextCompat.startForegroundService(this, Intent(this, ScreenRecordService::class.java).apply {
                          action = "START"; putExtra("code", r.resultCode); putExtra("data", r.data)
                      })
                      moveTaskToBack(true)
                  }
              }

              private fun dp(x: Int) = (x * resources.displayMetrics.density).toInt()

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  prefs = getSharedPreferences("ef", Context.MODE_PRIVATE)
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(16), dp(12), dp(16), dp(12)) }
                  fun btn(t: String, f: () -> Unit) = Button(this).apply { text = t; setOnClickListener { f() } }

                  root.addView(TextView(this).apply { text = "ইয়ার-ফ্লো"; textSize = 26f })
                  root.addView(Switch(this).apply {
                      text = "অটো কল রেকর্ড"
                      isChecked = prefs.getBoolean("auto", false)
                      setOnCheckedChangeListener { _, on ->
                          prefs.edit().putBoolean("auto", on).apply()
                          val i = Intent(this@MainActivity, CallRecordService::class.java).setAction(if (on) "IDLE" else "QUIT")
                          ContextCompat.startForegroundService(this@MainActivity, i)
                      }
                  })
                  root.addView(btn("পারমিশন সেটআপ") { setupDialog() })
                  root.addView(btn("🔴 স্ক্রিন রেকর্ড শুরু") { startScreen() })
                  root.addView(btn("⚙ সেটিংস") { settingsDialog() })

                  val tabs = LinearLayout(this)
                  tabs.addView(btn("কল রেকর্ডিং") { tab = 0; refresh() }, LinearLayout.LayoutParams(0, -2, 1f))
                  tabs.addView(btn("ভিডিও") { tab = 1; refresh() }, LinearLayout.LayoutParams(0, -2, 1f))
                  root.addView(tabs)

                  list = ListView(this)
                  root.addView(list, LinearLayout.LayoutParams(MATCH_PARENT, 0, 1f))
                  setContentView(root)

                  if (prefs.getBoolean("auto", false))
                      ContextCompat.startForegroundService(this, Intent(this, CallRecordService::class.java).setAction("IDLE"))

                  list.setOnItemClickListener { _, _, pos, _ ->
                      val f = files[pos]
                      if (tab == 1) startActivity(Intent(this, EditorActivity::class.java).putExtra("path", f.absolutePath))
                      else { player?.release(); player = MediaPlayer().apply { setDataSource(f.absolutePath); prepare(); start() } }
                  }
                  list.setOnItemLongClickListener { _, _, pos, _ ->
                      AlertDialog.Builder(this).setMessage("মুছে ফেলবেন?")
                          .setPositiveButton("হ্যাঁ") { _, _ -> files[pos].delete(); refresh() }
                          .setNegativeButton("না", null).show()
                      true
                  }
              }

              override fun onResume() { super.onResume(); refresh() }
              override fun onDestroy() { player?.release(); super.onDestroy() }

              private fun refresh() {
                  val dir = File(getExternalFilesDir(null), if (tab == 0) "calls" else "videos")
                  files = dir.listFiles()?.sortedByDescending { it.lastModified() } ?: emptyList()
                  list.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1,
                      files.map { it.nameWithoutExtension.replace("_", "  ") })
              }

              private fun startScreen() {
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "আগে ওভারলে পারমিশন দিন", Toast.LENGTH_LONG).show()
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      return
                  }
                  ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.POST_NOTIFICATIONS), 2)
                  projLauncher.launch((getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager).createScreenCaptureIntent())
              }

              private fun setupDialog() {
                  val items = arrayOf("১. রানটাইম পারমিশন (ফোন, কল লগ, মাইক, কন্টাক্ট)", "২. ওভারলে (ভাসমান বিন্দু)",
                      "৩. ব্যাটারি অপটিমাইজেশন বন্ধ", "৪. অ্যাক্সেসিবিলিটি চালু (কলে মাইকের জন্য)")
                  AlertDialog.Builder(this).setTitle("সব ধাপ করুন").setItems(items) { _, i ->
                      when (i) {
                          0 -> ActivityCompat.requestPermissions(this, arrayOf(
                              Manifest.permission.READ_PHONE_STATE, Manifest.permission.READ_CALL_LOG,
                              Manifest.permission.PROCESS_OUTGOING_CALLS, Manifest.permission.RECORD_AUDIO,
                              Manifest.permission.READ_CONTACTS, Manifest.permission.POST_NOTIFICATIONS), 1)
                          1 -> startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                          2 -> if (!(getSystemService(POWER_SERVICE) as PowerManager).isIgnoringBatteryOptimizations(packageName))
                              startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:$packageName")))
                          3 -> startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }.show()
              }

              private fun settingsDialog() {
                  val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(20), dp(10), dp(20), dp(10)) }
                  fun spin(label: String, names: List<String>, vals: List<Int>, key: String, def: Int) {
                      box.addView(TextView(this).apply { text = label })
                      box.addView(Spinner(this).apply {
                          adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, names)
                          setSelection(vals.indexOf(prefs.getInt(key, def)).coerceAtLeast(0))
                          onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                              override fun onItemSelected(p: AdapterView<*>?, v: View?, pos: Int, id: Long) {
                                  prefs.edit().putInt(key, vals[pos]).apply()
                              }
                              override fun onNothingSelected(p: AdapterView<*>?) {}
                          }
                      })
                  }
                  fun chk(label: String, key: String, def: Boolean) = box.addView(CheckBox(this).apply {
                      text = label; isChecked = prefs.getBoolean(key, def)
                      setOnCheckedChangeListener { _, on -> prefs.edit().putBoolean(key, on).apply() }
                  })
                  box.addView(TextView(this).apply { text = "— স্ক্রিন রেকর্ড —"; textSize = 16f })
                  spin("রেজোলিউশন", listOf("720p", "1080p", "ফোনের নেটিভ"), listOf(720, 1080, 0), "quality", 1080)
                  spin("FPS", listOf("30", "60"), listOf(30, 60), "fps", 60)
                  spin("বিটরেট", listOf("8 Mbps", "16 Mbps", "24 Mbps"), listOf(8, 16, 24), "bitrate", 16)
                  chk("মাইক্রোফোন (ভয়েস) রেকর্ড", "mic", true)
                  chk("৩-২-১ কাউন্টডাউন", "countdown", true)
                  chk("ভাসমান ইশারা-বিন্দু দেখান", "dot", true)
                  spin("বিন্দুর রঙ", listOf("লাল", "হলুদ", "সবুজ"), listOf(0, 1, 2), "dotColor", 0)
                  box.addView(TextView(this).apply { text = "— কল রেকর্ড —"; textSize = 16f; setPadding(0, dp(12), 0, 0) })
                  chk("কলে অটো স্পিকার + ফুল ভলিউম", "speaker", true)
                  spin("সাউন্ড বুস্ট (সর্বোচ্চ)", listOf("৪x", "৮x", "১২x", "২০x"), listOf(4, 8, 12, 20), "gain", 12)
                  AlertDialog.Builder(this).setView(ScrollView(this).apply { addView(box) })
                      .setPositiveButton("ঠিক আছে", null).show()
              }
          }
