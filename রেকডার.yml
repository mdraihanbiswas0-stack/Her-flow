# ইয়ার-ফ্লো (EarFlow) — একটি ফাইলেই পুরো অ্যাপ
# ব্যবহার: GitHub repo-তে এই ফাইলটি .github/workflows/build.yml নামে রাখুন।
# commit করলেই অটো APK বিল্ড শুরু হবে। Actions ট্যাব > Artifacts থেকে APK নামান।
name: Build EarFlow APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create EarFlow project files
        run: |
          set -e
          mkdir -p earflow_project
          mkdir -p earflow_project/app
          mkdir -p earflow_project/app/src/main
          mkdir -p earflow_project/app/src/main/java/com/earflow/app
          mkdir -p earflow_project/app/src/main/res/drawable
          mkdir -p earflow_project/app/src/main/res/mipmap-anydpi-v26
          mkdir -p earflow_project/app/src/main/res/values
          mkdir -p earflow_project/app/src/main/res/xml
          cat > earflow_project/app/build.gradle <<'EFEOF'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.earflow.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.earflow.app"
                  minSdk 29
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core-ktx:1.12.0'
          }
          EFEOF
          cat > earflow_project/app/src/main/AndroidManifest.xml <<'EFEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_PHONE_STATE"/>
              <uses-permission android:name="android.permission.READ_CALL_LOG"/>
              <uses-permission android:name="android.permission.PROCESS_OUTGOING_CALLS"/>
              <uses-permission android:name="android.permission.READ_CONTACTS"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>

              <application android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
